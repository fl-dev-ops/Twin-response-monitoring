name: Refresh dashboard

# Every hour, and by hand: Actions → Refresh dashboard → Run workflow.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build the page from Langfuse
        env:
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ secrets.LANGFUSE_BASE_URL }}
        run: |
          mkdir -p site
          python3 scripts/latency_report.py --out site/index.html

      - name: Publish to Cloudflare Pages
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Values pasted with quotes or spaces still work.
          export CLOUDFLARE_API_TOKEN="$(printf '%s' "$TOKEN" | tr -d '"'"'"' \r\n')"
          export CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$ACCOUNT" | tr -d '"'"'"' \r\n')"
          npx --yes wrangler@4 pages deploy site --project-name=twin-response --branch=main --commit-dirty=true
